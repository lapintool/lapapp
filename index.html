<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lapapp</title>
    <script>
      // 首帧前应用主题，避免启动闪烁；window.__LAPAPP_THEME__ 由 Rust 注入
      try {
        var t =
          window.__LAPAPP_THEME__ || localStorage.getItem("lapapp-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
